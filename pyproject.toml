[build-system]
requires      = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboard-ai"
version = "0.1.0"
description = "Local-first GraphRAG + AutoGen onboarding assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Onboard AI Contributors" }]
keywords = ["graphrag", "onboarding", "autogen", "chainlit", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.116.1,<1",
    "uvicorn[standard]>=0.35,<0.36",
    "litellm>=1.79,<2",
    "ollama>=0.6,<0.7",
    "pyautogen>=0.10,<0.11",
    "tiktoken>=0.12,<0.13",
    "chainlit==2.9.2",
    "graphrag==3.0.2",
    "docling>=2.5,<3",
    "markitdown>=0.1,<0.2",
    "psutil>=7,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx",
    "ruff>=0.9.0",
    "mypy>=1.11",
    "types-psutil",
    "pre-commit",
]

[project.scripts]
onboard-ai-api          = "onboard_ai.cli:run_api"
onboard-ai-ui           = "onboard_ai.cli:run_ui"
onboard-ai-bootstrap    = "onboard_ai.cli:bootstrap"
onboard-ai-convert      = "onboard_ai.tools.ingestion.convert_anything:main"
onboard-ai-profile      = "onboard_ai.tools.profiling.profile_queries:main"
onboard-ai-gate         = "onboard_ai.tools.evaluation.local_quality_gate:main"
onboard-ai-prompt-audit = "onboard_ai.tools.profiling.prompt_token_audit:main"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["onboard_ai*"]

[tool.ruff]
line-length    = 100
target-version = "py312"
exclude        = [".git", ".venv", "data", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts    = "-q"
testpaths  = ["tests"]

[tool.mypy]
python_version         = "3.12"
ignore_missing_imports = true
warn_redundant_casts   = true
warn_unused_ignores    = true
warn_return_any        = false
check_untyped_defs     = false
exclude                = ["^data/", "^cache/"]
