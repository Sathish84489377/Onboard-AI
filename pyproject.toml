[build-system]
requires      = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogen-graphrag-onboarding"
version = "0.1.0"
description = "Local-first GraphRAG + AutoGen onboarding assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "litellm[proxy]",
    "ollama",
    "pyautogen[retrievechat]",
    "tiktoken",
    "chainlit",
    "graphrag",
    "marker-pdf",
    "torch",
    "docling",
    "markitdown",
    "psutil",
    "typer>=0.16,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx",
    "ruff>=0.9.0",
    "mypy>=1.11",
    "types-psutil",
]

[project.scripts]
onboard-ai-api          = "onboard_ai.cli:run_api"
onboard-ai-ui           = "onboard_ai.cli:run_ui"
onboard-ai-bootstrap    = "onboard_ai.cli:bootstrap"
onboard-ai-convert      = "onboard_ai.tools.ingestion.convert_anything:main"
onboard-ai-profile      = "onboard_ai.tools.profiling.profile_queries:main"
onboard-ai-gate         = "onboard_ai.tools.evaluation.local_quality_gate:main"
onboard-ai-prompt-audit = "onboard_ai.tools.profiling.prompt_token_audit:main"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["onboard_ai*"]

[tool.ruff]
line-length    = 100
target-version = "py311"
exclude        = [".git", ".venv", "data", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts    = "-q"
testpaths  = ["tests"]

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
warn_redundant_casts   = true
warn_unused_ignores    = true
warn_return_any        = false
check_untyped_defs     = false
exclude                = ["^data/", "^cache/"]
